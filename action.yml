name: 'Telemetry PRs'
description: 'Catch missing OpenTelemetry spans, metrics, logs, and high-cardinality labels in TypeScript/Node.js pull requests — fast, static, and 100% in your CI.'
author: 'Telemetry PRs'
branding:
  icon: 'activity'
  color: 'blue'

inputs:
  config:
    description: 'Path to the .telemetry-prs.yml configuration file'
    required: false
    default: '.telemetry-prs.yml'
  block-on:
    description: 'Minimum impact tier that fails CI: "none" (comment only), "high", "medium", or "low"'
    required: false
    default: ''
  mode:
    description: 'Legacy alias for block-on: "comment" (none) or "fail" (high)'
    required: false
    default: ''
  github-token:
    description: 'GitHub token with pull-requests: write permission to post/update PR comments'
    required: false
    default: ${{ github.token }}
  comment-on-pr:
    description: 'Post or update a single summary comment on the pull request'
    required: false
    default: 'true'
  annotate:
    description: 'Emit inline GitHub Actions annotations on changed lines'
    required: false
    default: 'false'
  sarif-file:
    description: 'Optional output path to write a SARIF 2.1.0 report for GitHub Code Scanning'
    required: false
    default: ''

outputs:
  findings-count:
    description: 'Total number of telemetry gaps and cardinality risks found in the PR diff'
  high-impact-count:
    description: 'Number of high-impact findings (blind-spot workers, cardinality risks)'
  medium-impact-count:
    description: 'Number of medium-impact findings (swallowed errors, uninstrumented HTTP handlers)'
  low-impact-count:
    description: 'Number of low-impact findings (generic or empty span names)'
  coverage-percent:
    description: 'Percentage of touched handlers, workers, and catch blocks passing telemetry checks'

runs:
  using: 'node24'
  main: 'dist/index.cjs'
